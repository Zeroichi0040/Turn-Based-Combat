name: Publish v0.1.0
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Zeroichi0040/Turn-Based-Combat' && github.event.pull_request.number == 8 && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'feat/release-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Publish approved initial release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --json url >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            gh release view v0.1.0 --json url,tagName,isDraft,isPrerelease,targetCommitish
            exit 0
          fi
          gh release create v0.1.0 --target "$RELEASE_SHA" --title "Turn-Based Combat v0.1.0" --notes-file docs/RELEASE_NOTES_v0.1.0.md --latest
          gh release view v0.1.0 --json url,tagName,isDraft,isPrerelease,targetCommitish
