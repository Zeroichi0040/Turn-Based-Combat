name: Publish approved release
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved version, matching package.json (e.g. 0.1.1)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'Zeroichi0040/Turn-Based-Combat' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v') &&
        contains(github.event.pull_request.labels.*.name, 'release-approved')))
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate version and notes
        id: version
        env:
          REQUESTED_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          node -e 'const fs=require("fs");const v=process.env.REQUESTED_VERSION||process.env.RELEASE_BRANCH.replace(/^release\/v/,"");const pkg=require("./package.json"),lock=require("./package-lock.json");if(!/^\d+\.\d+\.\d+$/.test(v)||pkg.version!==v||lock.version!==v||lock.packages[""].version!==v||!fs.existsSync("docs/RELEASE_NOTES_v"+v+".md"))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,"version="+v+"\nsha="+process.env.RELEASE_SHA+"\n")'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish exact tested commit (never overwrite an existing tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_SHA"
          gh release create "$tag" --verify-tag --title "Turn-Based Combat $tag" --notes-file "docs/RELEASE_NOTES_$tag.md" --latest
